# Watches upstream Zed for a new stable release and rebases this fork's patch
# series onto it, weekly.
#
# The point of the fork is a patch that stays current. Zed ships roughly weekly,
# and doing this by hand means noticing the release, rebasing, and discovering
# any API break during a two-hour build. This does the noticing and the
# discovering, and stops the moment anything looks wrong.
#
# When the rebase, the crate check and the tests all pass, it tags the result,
# which starts cc-release.yml: three platform builds, each guarding that its
# artifact is a dev-channel build of the tagged commit, and a release that
# promotes itself only when all three are green. The main line is never touched:
# work happens on `auto/v<tag>`, which is disposable and force-pushed freely,
# and adopting it onto `main-patched` stays a human act -- the issue this job
# opens carries the recipe.
#
# The branch and the tag are pushed with the CC_RELEASE_PAT secret (fine-grained,
# contents:write *and workflows:write* on this repository only, **expires
# 2027-08-30** -- expect the fallback below around then). The branch needs the
# PAT as much as the tag does: upstream keeps changing files under
# .github/workflows/, and GitHub refuses any push that carries such a change
# from GITHUB_TOKEN, which has no `workflows` permission to grant -- the first
# rebase onto v1.18.0 (2026-09-04) died exactly there, after a green check and
# test. A tag pushed with GITHUB_TOKEN starts no workflow run either: GitHub
# suppresses that so workflows cannot trigger each other in a loop. With the
# secret absent or expired, every path ends at an issue with the manual tag
# recipe instead, and nothing is built or shipped.
#
# Note on the heredocs below: their terminators sit at the *base* indentation of
# the `run:` block, not the indentation of the surrounding `if`. YAML strips the
# block's common indent, which puts the terminator at column 0 where the shell
# needs it. Indenting them to match the `if` closes the YAML block scalar early
# and the file stops parsing.
name: auto-rebase

on:
  schedule:
    # Tuesdays 05:37 UTC. Zed's releases land midweek, so early in the week
    # still picks up the previous release after a few days of other people
    # finding its bugs. The odd slot is deliberate: GitHub's cron scheduler is
    # most congested at minute 0 of a round hour on Monday mornings, when
    # everyone's weekly job fires -- delayed runs are common there and a
    # dropped slot is possible. A missed slot is never backfilled; it simply
    # waits a week, which costs nothing here but is worth avoiding for free.
    - cron: "37 5 * * 2"
  workflow_dispatch:
    inputs:
      target_tag:
        description: Upstream tag to rebase onto (blank = newest stable)
        required: false
        default: ""

# Naming any scope sets the rest to none, so both are explicit: `contents` to
# push the auto branch, `issues` to report what happened.
permissions:
  contents: write
  issues: write

# A rebase plus a full crate build runs over an hour. Two racing would fight over
# the same auto branch for no benefit.
concurrency:
  group: auto-rebase
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main-patched
          # The rebase needs real history, and `git describe` needs the upstream
          # tag this series currently sits on.
          fetch-depth: 0

      - name: Work out where we are and where upstream is
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.target_tag }}
        run: |
          set -euo pipefail

          # /releases/latest is defined to exclude prereleases and drafts, which
          # is the filter wanted here -- picking the newest tag by name would
          # happily grab a `-pre`.
          if [ -n "$REQUESTED" ]; then
            new="$REQUESTED"
          else
            new=$(gh api repos/zed-industries/zed/releases/latest --jq .tag_name)
          fi

          # `gh issue create --label` fails outright if the label is missing,
          # which would turn every report below into a second failure that
          # reports nothing. --force makes this idempotent.
          gh label create auto-rebase --color 0e8a16 --force \
            --description "Opened by the weekly auto-rebase job" >/dev/null 2>&1 || true

          # A fork does not inherit upstream's tags, and `git describe` needs
          # them to say which release this series was built on. The refspec keeps
          # this to tags; `--tags` would also drag in every upstream branch.
          git remote add upstream https://github.com/zed-industries/zed.git
          git fetch --no-tags upstream "refs/tags/v*:refs/tags/v*"

          if ! git rev-parse -q --verify "refs/tags/$new" >/dev/null; then
            echo "upstream tag $new does not exist" >&2
            exit 1
          fi

          base=$(git describe --tags --match 'v*' --abbrev=0)

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          {
            echo "current base : $base"
            echo "upstream     : $new"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$base" = "$new" ]; then
            echo "already-current=true" >> "$GITHUB_OUTPUT"
            echo "Already on the newest stable release; nothing to do." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "already-current=false" >> "$GITHUB_OUTPUT"
          fi

      # Every later step carries this guard. The common weekly case is that
      # upstream has not shipped, and that case must cost seconds rather than an
      # hour of runner time.
      - name: Rebase the patch series
        id: rebase
        if: steps.target.outputs.already-current == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.target.outputs.base }}
          NEW: ${{ steps.target.outputs.new }}
          CC_RELEASE_PAT: ${{ secrets.CC_RELEASE_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Without this the rebase dies at commit 9 of the series, every run:
          #
          #   error: unable to create symlink CLAUDE.md: File name too long
          #
          # Upstream ships CLAUDE.md as a symlink to .rules. The commit that
          # introduces this fork's replacement still carries mode 120000, and a
          # later commit corrects it to 100644 -- so replaying the first one asks
          # the filesystem for a symlink whose target is the whole document, and
          # ENAMETOOLONG stops the rebase. Invisible on Windows, which is where
          # the bad mode was committed and why it survived; fatal on the runner.
          #
          # core.symlinks=false makes git write symlinks out as ordinary files
          # containing their target. It changes only the worktree: the 262
          # symlinks in this tree keep mode 120000 in every commit, verified
          # against a local replay of this exact rebase. None of them is a build
          # input -- they are LICENSE files, AGENTS.md and GEMINI.md -- so cargo
          # is unaffected, and the worktree is discarded when the job ends.
          git config core.symlinks false

          git checkout -b "auto/$NEW"

          # --onto replays only our commits: everything after the old upstream
          # tag, replanted on the new one. Rebasing against the branch instead
          # would try to replay upstream's own commits onto themselves.
          if git rebase --onto "$NEW" "$BASE"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflicts=$(git diff --name-only --diff-filter=U | sed 's/^/- `/;s/$/`/')
          # A rebase can stop without any unmerged path -- a checkout that the
          # filesystem refuses, for one. Saying "conflicts" and then listing
          # nothing sends the reader looking for a merge that never happened.
          if [ -z "$conflicts" ]; then
            conflicts="_No conflicting files. The rebase stopped for some other reason; read the run log._"
          fi
          git rebase --abort

          title="auto-rebase: $NEW conflicts with the patch series"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')" ]; then
            echo "issue already open" && exit 1
          fi

          cat > issue.md <<BODY
          Rebasing this fork's patch series from \`$BASE\` onto \`$NEW\` hit
          conflicts, so nothing was built and no branch was pushed.

          Conflicting files:

          $conflicts

          The patch is one new crate plus a 43-line graft into existing Zed code,
          and only the graft can realistically conflict, so the file list usually
          names the fix. To resolve locally:

          \`\`\`
          git fetch fork && git fetch upstream --tags
          git checkout -b auto/$NEW main-patched
          git rebase --onto $NEW $BASE
          \`\`\`

          Re-run [auto-rebase](../../actions/workflows/auto-rebase.yml) once
          \`main-patched\` moves, or leave this open -- the weekly run will not
          open a second copy.
          BODY
          # Created without --label, then labelled separately. `gh issue create`
          # resolves label names through GraphQL, which can lag the REST write
          # that creates the label by a few seconds -- and did, the first time
          # this job ran: the label existed, the lookup said it did not, and the
          # whole report was lost. On these paths the issue is the only thing the
          # job produces, so nothing cosmetic is allowed to be able to sink it.
          url=$(gh issue create --title "$title" --body-file issue.md)
          echo "$url"
          gh issue edit "$url" --add-label auto-rebase >/dev/null 2>&1 || true
          exit 1

      - name: Install Linux build dependencies
        if: steps.target.outputs.already-current == 'false'
        run: ./script/linux

      - uses: Swatinem/rust-cache@v2
        if: steps.target.outputs.already-current == 'false'
        with:
          # Deliberately shared with the release workflow's Linux leg: both
          # compile the same dependency graph, and a cold cache turns this job
          # from minutes into an hour.
          key: release-ubuntu-24.04
          cache-on-failure: true

      # Split from the test step because it fails in about a minute on the thing
      # a version bump actually breaks -- a changed Zed API -- rather than after
      # a full test build.
      - name: Check the crate against the new Zed
        id: check
        if: steps.target.outputs.already-current == 'false'
        run: |
          # Without pipefail the step takes tee's exit status, so a failing check
          # would report success and this gate would pass everything through.
          set -o pipefail
          cargo check --package claude_code_ide 2>&1 | tee check.log

      - name: Test the crate
        id: test
        if: steps.target.outputs.already-current == 'false'
        run: |
          set -o pipefail
          cargo test --package claude_code_ide -- --nocapture 2>&1 | tee test.log

      # `failure()` alone would also fire for a rebase conflict, which has
      # already opened its own issue; the guard keeps the two reports separate.
      - name: Report a build or test failure
        if: failure() && steps.rebase.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.target.outputs.base }}
          NEW: ${{ steps.target.outputs.new }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -uo pipefail
          if [ "$CHECK_OUTCOME" = "failure" ]; then
            stage="cargo check"; log=check.log
          else
            stage="cargo test"; log=test.log
          fi

          # The first error is the one worth reading: the rest are usually the
          # same API break echoing through the file, and a whole cargo log would
          # not fit in an issue body.
          excerpt=$(grep -m1 -A 20 -E '^error' "$log" 2>/dev/null \
            || tail -40 "$log" 2>/dev/null \
            || echo "no log captured")

          title="auto-rebase: $NEW fails $stage"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')" ]; then
            echo "issue already open" && exit 0
          fi

          cat > issue.md <<BODY
          The patch series rebased cleanly from \`$BASE\` onto \`$NEW\`, but
          \`$stage\` failed, so nothing was pushed or built.

          This is what the job exists to catch: upstream changed an API the
          \`claude_code_ide\` crate uses, and the editor would not have compiled.

          \`\`\`
          $excerpt
          \`\`\`

          Full log: [run ${{ github.run_id }}](../../actions/runs/${{ github.run_id }}).
          BODY
          # Created without --label, then labelled separately. `gh issue create`
          # resolves label names through GraphQL, which can lag the REST write
          # that creates the label by a few seconds -- and did, the first time
          # this job ran: the label existed, the lookup said it did not, and the
          # whole report was lost. On these paths the issue is the only thing the
          # job produces, so nothing cosmetic is allowed to be able to sink it.
          url=$(gh issue create --title "$title" --body-file issue.md)
          echo "$url"
          gh issue edit "$url" --add-label auto-rebase >/dev/null 2>&1 || true

      - name: Push the branch and ask for a release
        if: success() && steps.target.outputs.already-current == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.target.outputs.base }}
          NEW: ${{ steps.target.outputs.new }}
          # Read here, not only in the rebase step: this is the step that tags.
          # Declared on the wrong step, the tag path silently took the "secret
          # absent" branch and asked for a manual tag every time.
          CC_RELEASE_PAT: ${{ secrets.CC_RELEASE_PAT }}
        run: |
          set -euo pipefail
          # auto/* branches are scratch space, so a re-run replaces one freely.
          # The main line is never force-pushed.
          #
          # Pushed with the PAT when there is one: the replayed series carries
          # upstream's own changes under .github/workflows/, which GITHUB_TOKEN
          # is never allowed to write (see the header). Actions masks the secret
          # in logs; the issue body below redacts it by hand.
          if [ -n "${CC_RELEASE_PAT:-}" ]; then
            # actions/checkout persisted GITHUB_TOKEN as an `http.extraheader`,
            # and git sends that header even when the URL carries its own
            # credentials, so the PAT would never reach GitHub. Drop the header
            # for the rest of this step; the checkout's post-step tolerates it
            # being gone. `gh` is unaffected: it authenticates via GH_TOKEN.
            git config --unset-all http.https://github.com/.extraheader || true
            push_to="https://x-access-token:${CC_RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          else
            push_to=origin
          fi
          if ! git push --force "$push_to" "auto/$NEW" 2> push.err; then
            sed 's#x-access-token:[^@]*@#x-access-token:***@#' push.err >&2
            title="auto-rebase: cannot push auto/$NEW"
            if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')" ]; then
              cat > issue.md <<BODY
          The series rebased cleanly from \`$BASE\` onto \`$NEW\` and passed
          \`cargo check\` and \`cargo test\`, but pushing \`auto/$NEW\` was refused,
          so nothing was tagged or built:

          \`\`\`
          $(sed 's#x-access-token:[^@]*@#x-access-token:***@#' push.err)
          \`\`\`

          The usual cause: upstream changed files under \`.github/workflows/\`
          between \`$BASE\` and \`$NEW\`, and the token doing the push may not
          write workflow files. \`GITHUB_TOKEN\` never can. \`CC_RELEASE_PAT\` can
          once the token has the repository permission **Workflows: read and
          write** next to **Contents: read and write**. Fix the token, then re-run
          [auto-rebase](../../actions/workflows/auto-rebase.yml).
          BODY
              url=$(gh issue create --title "$title" --body-file issue.md)
              echo "$url"
              gh issue edit "$url" --add-label auto-rebase >/dev/null 2>&1 || true
            fi
            exit 1
          fi

          # One open issue per target version. This also keeps a re-run, or next
          # week's cron firing before last week's branch was adopted, from
          # tagging and building the same rebase twice.
          if [ -n "$(gh issue list --state open --search "in:title \"$NEW\"" --json number --jq '.[0].number // empty')" ]; then
            echo "an open issue already covers $NEW" && exit 0
          fi

          # Suffix rule: n = 1 + how many cc-<version>-* tags exist, counted on
          # the remote rather than in this clone, so a retry can never reuse a
          # number that already has a release attached to it.
          n=$(( $(git ls-remote --tags origin "refs/tags/cc-$NEW-*" | grep -c . || true) + 1 ))
          tag="cc-$NEW-$n"

          if [ -n "${CC_RELEASE_PAT:-}" ]; then
            # A tag pushed with GITHUB_TOKEN starts nothing -- GitHub suppresses
            # workflow triggers from that token to prevent loops -- so the tag
            # goes up with the fine-grained PAT instead. Actions masks the
            # secret in logs.
            git tag -a "$tag" -m "Zed ${NEW#v} + Claude Code IDE"
            git push "https://x-access-token:${CC_RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag"

            title="auto-rebase: $tag is building"
            cat > issue.md <<BODY
          \`auto/$NEW\` -- this fork's series rebased from \`$BASE\` onto
          upstream \`$NEW\` -- compiles, passes its tests, and has been tagged
          \`$tag\`. [cc-release](../../actions/workflows/cc-release.yml) is
          building it now. If every platform leg and its channel guard is green,
          the release **promotes itself to \`/releases/latest\`** and every
          machine picks it up on its next updater run; if anything is red,
          nothing is published at all.

          What stays manual is adopting the branch, once the release is out:
          BODY
          else
            title="auto-rebase: $NEW is ready to release"
            cat > issue.md <<BODY
          \`auto/$NEW\` carries this fork's patch series rebased from \`$BASE\`
          onto upstream \`$NEW\`. It compiles and its tests pass.

          Nothing has been built: the \`CC_RELEASE_PAT\` secret is not set (or
          has expired), and a tag pushed with \`GITHUB_TOKEN\` starts no
          workflow. Either restore the secret and re-run this job, or tag by
          hand:

          \`\`\`
          git fetch fork
          git checkout auto/$NEW
          git tag -a $tag -m "Zed ${NEW#v} + Claude Code IDE"
          git push fork $tag
          \`\`\`

          That starts [cc-release](../../actions/workflows/cc-release.yml),
          which builds all three platforms and, when every leg's channel guard
          passes, publishes and promotes the release itself. Then adopt the
          branch:
          BODY
          fi

          cat >> issue.md <<BODY

          \`\`\`
          git checkout main-patched && git reset --hard auto/$NEW
          git push --force-with-lease fork main-patched
          \`\`\`

          Adopting is a **reset, not a merge**. \`auto/$NEW\` is this series
          replayed onto a new base, so its commits are new objects and
          \`main-patched\` is not an ancestor of it -- \`merge --ff-only\`
          cannot work. That force-push rewrites the branch every other clone is
          sitting on, so tell the other machines before you run it; each one
          recovers with \`git fetch && git reset --hard <remote>/main-patched\`,
          never \`git pull\`.

          Finally, \`.github/README.md\` names the base tag in its compare link
          and its \`git fetch zed tag\` line. Point both at \`$NEW\`.

          (\`fork\` is the remote name on the Windows clone; it is \`origin\` on
          the others. Use whichever points at ixiion001/zed.)
          BODY
          # Created without --label, then labelled separately. `gh issue create`
          # resolves label names through GraphQL, which can lag the REST write
          # that creates the label by a few seconds -- and did, the first time
          # this job ran: the label existed, the lookup said it did not, and the
          # whole report was lost. On these paths the issue is the only thing the
          # job produces, so nothing cosmetic is allowed to be able to sink it.
          url=$(gh issue create --title "$title" --body-file issue.md)
          echo "$url"
          gh issue edit "$url" --add-label auto-rebase >/dev/null 2>&1 || true

# Keeps this fork's patch series on the newest stable Zed and released, weekly,
# without anyone having to follow up.
#
# The point of the fork is a patch that stays current. Zed ships roughly weekly,
# and doing this by hand means noticing the release, rebasing, and discovering
# any API break during a two-hour build. This does the noticing and the
# discovering, and stops the moment anything looks wrong.
#
# The job is driven by state, not by events, so a week that went wrong is simply
# repaired by the next run:
#
#   - `main-patched` sits on an older upstream stable -> rebase the series onto
#     the new one, check and test the crate, **move `main-patched` to the
#     result**, and tag it, which starts cc-release.yml.
#   - `main-patched` already sits on the newest stable but no release exists for
#     it -> check, test and tag it again. This covers a release build that went
#     red, a runner that never picked the job up, and a conflict the maintainer
#     resolved by hand and pushed to `main-patched`.
#   - a release exists, or one is building -> nothing to do, in seconds.
#
# Moving `main-patched` used to be a manual step, described in an issue the job
# opened. It was skipped for six weeks in autumn 2026 while releases were cut by
# hand from `auto/*` branches, and the job then replayed the stale series every
# Monday into a conflict that had long been resolved elsewhere (issue #6). There
# is one series now, it lives on `main-patched`, and the job keeps it there. The
# tip it replaces is archived as `auto/<old base tag>` first, and the move uses
# a lease, so a commit pushed while the job ran makes it fail rather than vanish.
#
# Issues are opened only for what needs a human: a rebase conflict, a crate that
# no longer compiles or passes its tests, a push GitHub refused, or a release
# that failed three times. Success is silent.
#
# Every push uses the CC_RELEASE_PAT secret (fine-grained, contents:write *and
# workflows:write* on this repository only, **expires 2027-08-30** -- expect the
# fallback below around then). The branch needs the PAT as much as the tag does:
# upstream keeps changing files under .github/workflows/, and GitHub refuses any
# push that carries such a change from GITHUB_TOKEN, which has no `workflows`
# permission to grant -- the first rebase onto v1.18.0 (2026-09-04) died exactly
# there, after a green check and test. A tag pushed with GITHUB_TOKEN starts no
# workflow run either: GitHub suppresses that so workflows cannot trigger each
# other in a loop. With the secret absent or expired, every path ends at an
# issue with the manual recipe instead, and nothing is built or shipped.
#
# Note on the heredocs below: their terminators sit at the *base* indentation of
# the `run:` block, not the indentation of the surrounding `if`. YAML strips the
# block's common indent, which puts the terminator at column 0 where the shell
# needs it. Indenting them to match the `if` closes the YAML block scalar early
# and the file stops parsing.
name: auto-rebase

on:
  schedule:
    # Mondays 12:19 UTC. The slot is chosen so the *release* -- not this job --
    # is downloadable by 09:00 Manila (01:00 UTC) Tuesday, which is when the
    # maintainer installs it. Work backwards along the chain: this job sits in
    # GitHub's scheduler queue, runs ~11 min, tags, and cc-release then takes
    # 3-4 h with the macOS leg as the long pole.
    #
    # The queue wait is the term that dominates, and it cannot be tuned away.
    # Measured 2026-09-22 across every cron in this fork -- upstream's inherited
    # ones skip on a fork guard, but their dispatch timestamps are real -- a
    # `schedule` event is held **2h11m to 6h47m**. A fork on the free tier sits
    # in a low-priority scheduling tier; the delay is not congestion at a
    # particular minute, and the same `0 16` slot produced both 1h52m and 4h08m.
    # So pick the slot to make the *whole* spread land before the deadline
    # rather than to shorten it: best case publishes 17:40 UTC Mon (01:40
    # Manila), worst 23:20 UTC Mon (07:20 Manila). Both beat 09:00.
    #
    # Zed ships midweek, so a Monday slot still lets a release settle for
    # several days before we rebase onto it. The odd minute stays free
    # insurance: minute 0 of a round hour is the most congested slot, and a
    # dropped slot is never backfilled -- it simply waits a week.
    - cron: "19 12 * * 1"
  workflow_dispatch:
    inputs:
      target_tag:
        description: Upstream tag to rebase onto (blank = newest stable)
        required: false
        default: ""

# Naming any scope sets the rest to none, so all are explicit: `contents` to
# push, `issues` to report what needs a human, `actions` to see whether a
# release is already building and to disable upstream workflows (last step).
permissions:
  contents: write
  issues: write
  actions: write

# A rebase plus a full crate build runs over an hour. Two racing would fight over
# the same branch for no benefit.
concurrency:
  group: auto-rebase
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # A release that keeps failing is a defect, not bad luck. After this many tags
  # for one upstream version without a release, stop and ask.
  MAX_RELEASE_ATTEMPTS: "3"

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main-patched
          # The rebase needs real history, and `git describe` needs the upstream
          # tag this series currently sits on.
          fetch-depth: 0
          # Do not leave GITHUB_TOKEN in git's config. The checkout action
          # stores it in a credentials file that an includeIf pulls into every
          # git command, and git sends that header even when a push URL carries
          # its own token -- so the PAT below would silently never be used and
          # GitHub would keep answering for "a GitHub App". Every push in this
          # job names its token in the URL instead; `gh` authenticates through
          # GH_TOKEN and is unaffected. Fetches here are from public repos.
          persist-credentials: false

      - name: Work out where we are and what is missing
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.target_tag }}
        run: |
          set -euo pipefail

          # /releases/latest is defined to exclude prereleases and drafts, which
          # is the filter wanted here -- picking the newest tag by name would
          # happily grab a `-pre`.
          if [ -n "$REQUESTED" ]; then
            new="$REQUESTED"
          else
            new=$(gh api repos/zed-industries/zed/releases/latest --jq .tag_name)
          fi

          # `gh issue create --label` fails outright if the label is missing,
          # which would turn every report below into a second failure that
          # reports nothing. --force makes this idempotent.
          gh label create auto-rebase --color 0e8a16 --force \
            --description "Opened by the weekly auto-rebase job" >/dev/null 2>&1 || true

          # A fork does not inherit upstream's tags, and `git describe` needs
          # them to say which release this series was built on. The refspec keeps
          # this to tags; `--tags` would also drag in every upstream branch.
          git remote add upstream https://github.com/zed-industries/zed.git
          git fetch --no-tags upstream "refs/tags/v*:refs/tags/v*"

          if ! git rev-parse -q --verify "refs/tags/$new" >/dev/null; then
            echo "upstream tag $new does not exist" >&2
            exit 1
          fi

          base=$(git describe --tags --match 'v*' --abbrev=0)

          {
            echo "base=$base"
            echo "new=$new"
            # The lease for moving main-patched later: the move goes through only
            # if the branch is still where this job found it.
            echo "start=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "current base : $base"
            echo "upstream     : $new"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          decide() {
            echo "mode=$1" >> "$GITHUB_OUTPUT"
            echo "$2" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          if [ "$base" != "$new" ]; then
            decide rebase "Rebasing the series from $base onto $new."
            exit 0
          fi

          # On the newest stable already. Whether that is the end of it depends
          # on a release existing, which is what the maintainer actually wants.
          #
          # Any release object counts, prerelease included: cc-release creates
          # one only after all three platforms are green, so its existence means
          # the build worked, and a release the maintainer demoted on purpose
          # must not be rebuilt behind their back.
          released=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name | startswith(\"cc-$new-\")) | .tag_name" | sed -n 1p)
          if [ -n "$released" ]; then
            decide none "Already on $new and released as $released; nothing to do."
            exit 0
          fi

          # A tag pushed minutes ago has no release yet either. cc-release takes
          # 3-4 h, so "no release" only means failure once no run is in flight.
          building=$(gh run list --workflow cc-release.yml --limit 50 \
            --json status,headBranch \
            --jq "[.[] | select(.status != \"completed\") | select(.headBranch | startswith(\"cc-$new-\"))] | length")
          if [ "$building" != "0" ]; then
            decide none "Already on $new and its release is building; nothing to do."
            exit 0
          fi

          # --refs drops the peeled `^{}` line an annotated tag would add, which
          # would count every tag twice.
          attempts=$(git ls-remote --tags --refs origin "refs/tags/cc-$new-*" | grep -c . || true)
          if [ "$attempts" -ge "$MAX_RELEASE_ATTEMPTS" ]; then
            title="auto-rebase: $new failed to release $attempts times"
            if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')" ]; then
              cat > issue.md <<BODY
          \`main-patched\` sits on upstream \`$new\` and has been tagged
          $attempts times (\`cc-$new-1\` .. \`cc-$new-$attempts\`), but
          [cc-release](../../actions/workflows/cc-release.yml) has not produced a
          release from any of them. The weekly job has stopped retrying.

          Read the newest failed cc-release run, fix what it names on
          \`main-patched\`, then tag by hand:

          \`\`\`
          git fetch fork && git checkout main-patched && git reset --hard fork/main-patched
          git tag -a cc-$new-$((attempts + 1)) -m "Zed ${new#v} + Claude Code IDE"
          git push fork cc-$new-$((attempts + 1))
          \`\`\`

          (\`fork\` is the remote name on the Windows clone; it is \`origin\` on
          the others. Use whichever points at ixiion001/zed.)
          BODY
              url=$(gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -F body=@issue.md --jq .html_url)
              echo "$url"
              gh issue edit "$url" --add-label auto-rebase >/dev/null 2>&1 || true
            fi
            decide none "Already on $new, but $attempts release attempts failed; see the open issue."
            exit 1
          fi

          decide release "Already on $new but it has no release ($attempts earlier attempts); testing and tagging it."

      # Every later step carries a guard on the mode. The common weekly case is
      # that upstream has not shipped, and that case must cost seconds rather
      # than an hour of runner time.
      - name: Rebase the patch series
        id: rebase
        if: steps.target.outputs.mode == 'rebase'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.target.outputs.base }}
          NEW: ${{ steps.target.outputs.new }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Without this the rebase dies at commit 9 of the series, every run:
          #
          #   error: unable to create symlink CLAUDE.md: File name too long
          #
          # Upstream ships CLAUDE.md as a symlink to .rules. The commit that
          # introduces this fork's replacement still carries mode 120000, and a
          # later commit corrects it to 100644 -- so replaying the first one asks
          # the filesystem for a symlink whose target is the whole document, and
          # ENAMETOOLONG stops the rebase. Invisible on Windows, which is where
          # the bad mode was committed and why it survived; fatal on the runner.
          #
          # core.symlinks=false makes git write symlinks out as ordinary files
          # containing their target. It changes only the worktree: the 262
          # symlinks in this tree keep mode 120000 in every commit, verified
          # against a local replay of this exact rebase. None of them is a build
          # input -- they are LICENSE files, AGENTS.md and GEMINI.md -- so cargo
          # is unaffected, and the worktree is discarded when the job ends.
          git config core.symlinks false

          # --onto replays only our commits: everything after the old upstream
          # tag, replanted on the new one. Rebasing against the branch instead
          # would try to replay upstream's own commits onto themselves.
          if git rebase --onto "$NEW" "$BASE"; then
            # .github/README.md names the base tag in its compare links and its
            # `git fetch zed tag` line. The guard on a preceding `-` keeps the
            # changelog's own `cc-v1.2.3-1` release names as they were.
            pattern="(^|[^-])${BASE//./\\.}"
            sed -i -E "s/$pattern/\1$NEW/g" .github/README.md
            if ! git diff --quiet -- .github/README.md; then
              git add .github/README.md
              # One such commit at the tip, rewritten each time, rather than one
              # more per upstream release for the rest of the series' life.
              if git log -1 --format=%s | grep -q '^docs: Point the base tag at '; then
                git commit -q --amend -m "docs: Point the base tag at $NEW"
              else
                git commit -q -m "docs: Point the base tag at $NEW"
              fi
            fi
            exit 0
          fi

          conflicts=$(git diff --name-only --diff-filter=U | sed 's/^/- `/;s/$/`/')
          # A rebase can stop without any unmerged path -- a checkout that the
          # filesystem refuses, for one. Saying "conflicts" and then listing
          # nothing sends the reader looking for a merge that never happened.
          if [ -z "$conflicts" ]; then
            conflicts="_No conflicting files. The rebase stopped for some other reason; read the run log._"
          fi
          git rebase --abort

          title="auto-rebase: $NEW conflicts with the patch series"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')" ]; then
            echo "issue already open" && exit 1
          fi

          cat > issue.md <<BODY
          Rebasing this fork's patch series from \`$BASE\` onto \`$NEW\` hit
          conflicts, so nothing was built and \`main-patched\` was not moved.

          Conflicting files:

          $conflicts

          The patch is one new crate plus a 43-line graft into existing Zed code,
          and only the graft can realistically conflict, so the file list usually
          names the fix. Resolve it locally and push the result **to
          \`main-patched\` itself**:

          \`\`\`
          git fetch fork main-patched && git fetch --no-tags upstream tag $NEW
          git checkout main-patched && git reset --hard fork/main-patched
          git rebase --onto $NEW $BASE
          # resolve, git rebase --continue
          git push --force-with-lease fork main-patched
          \`\`\`

          That is all. The next weekly run -- or a manual run of
          [auto-rebase](../../actions/workflows/auto-rebase.yml) -- finds
          \`main-patched\` on \`$NEW\` without a release, tests it, and tags it.
          Do not park the result on an \`auto/*\` branch: the job only ever reads
          \`main-patched\`, and a fix it cannot see is a conflict it meets again.

          (\`fork\` is the remote name on the Windows clone; it is \`origin\` on
          the others. Use whichever points at ixiion001/zed.)
          BODY
          # Created without --label, then labelled separately. `gh issue create`
          # resolves label names through GraphQL, which can lag the REST write
          # that creates the label by a few seconds -- and did, the first time
          # this job ran: the label existed, the lookup said it did not, and the
          # whole report was lost. On these paths the issue is the only thing the
          # job produces, so nothing cosmetic is allowed to be able to sink it.
          url=$(gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -F body=@issue.md --jq .html_url)
          echo "$url"
          gh issue edit "$url" --add-label auto-rebase >/dev/null 2>&1 || true
          exit 1

      - name: Install Linux build dependencies
        if: steps.target.outputs.mode == 'rebase' || steps.target.outputs.mode == 'release'
        run: ./script/linux

      - uses: Swatinem/rust-cache@v2
        if: steps.target.outputs.mode == 'rebase' || steps.target.outputs.mode == 'release'
        with:
          # Deliberately shared with the release workflow's Linux leg: both
          # compile the same dependency graph, and a cold cache turns this job
          # from minutes into an hour.
          key: release-ubuntu-24.04
          cache-on-failure: true

      # Split from the test step because it fails in about a minute on the thing
      # a version bump actually breaks -- a changed Zed API -- rather than after
      # a full test build.
      - name: Check the crate against the new Zed
        id: check
        if: steps.target.outputs.mode == 'rebase' || steps.target.outputs.mode == 'release'
        run: |
          # Without pipefail the step takes tee's exit status, so a failing check
          # would report success and this gate would pass everything through.
          set -o pipefail
          cargo check --package claude_code_ide 2>&1 | tee check.log

      - name: Test the crate
        id: test
        if: steps.target.outputs.mode == 'rebase' || steps.target.outputs.mode == 'release'
        run: |
          set -o pipefail
          cargo test --package claude_code_ide -- --nocapture 2>&1 | tee test.log

      # Keyed on these two steps' own outcomes: `failure()` alone would also
      # fire for a rebase conflict, which has already opened its own issue.
      - name: Report a build or test failure
        if: failure() && (steps.check.outcome == 'failure' || steps.test.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.target.outputs.base }}
          NEW: ${{ steps.target.outputs.new }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -uo pipefail
          if [ "$CHECK_OUTCOME" = "failure" ]; then
            stage="cargo check"; log=check.log
          else
            stage="cargo test"; log=test.log
          fi

          # The first error is the one worth reading: the rest are usually the
          # same API break echoing through the file, and a whole cargo log would
          # not fit in an issue body.
          excerpt=$(grep -m1 -A 20 -E '^error' "$log" 2>/dev/null \
            || tail -40 "$log" 2>/dev/null \
            || echo "no log captured")

          title="auto-rebase: $NEW fails $stage"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')" ]; then
            echo "issue already open" && exit 0
          fi

          cat > issue.md <<BODY
          The patch series (previous base \`$BASE\`) applies to \`$NEW\`, but
          \`$stage\` failed, so \`main-patched\` was not moved and nothing was
          tagged or built.

          This is what the job exists to catch: upstream changed an API the
          \`claude_code_ide\` crate uses, and the editor would not have compiled.

          \`\`\`
          $excerpt
          \`\`\`

          Full log: [run ${{ github.run_id }}](../../actions/runs/${{ github.run_id }}).

          Fix it on \`main-patched\` -- rebased onto \`$NEW\` if it is not there
          yet -- and push. The next run tests it again and tags it.
          BODY
          # Created without --label, then labelled separately. `gh issue create`
          # resolves label names through GraphQL, which can lag the REST write
          # that creates the label by a few seconds -- and did, the first time
          # this job ran: the label existed, the lookup said it did not, and the
          # whole report was lost. On these paths the issue is the only thing the
          # job produces, so nothing cosmetic is allowed to be able to sink it.
          url=$(gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -F body=@issue.md --jq .html_url)
          echo "$url"
          gh issue edit "$url" --add-label auto-rebase >/dev/null 2>&1 || true

      - name: Move main-patched and tag the release
        if: success() && (steps.target.outputs.mode == 'rebase' || steps.target.outputs.mode == 'release')
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.target.outputs.mode }}
          BASE: ${{ steps.target.outputs.base }}
          NEW: ${{ steps.target.outputs.new }}
          START: ${{ steps.target.outputs.start }}
          # Read here, not only where it was first needed: this is the step that
          # pushes. Declared on the wrong step, the tag path silently took the
          # "secret absent" branch and asked for a manual tag every time.
          CC_RELEASE_PAT: ${{ secrets.CC_RELEASE_PAT }}
        run: |
          set -euo pipefail
          # Nothing is persisted in git's config (see the checkout step), so
          # each push names its token in the URL. The PAT when there is one: the
          # replayed series carries upstream's own changes under
          # .github/workflows/, which GITHUB_TOKEN is never allowed to write
          # (see the header). Actions masks the secret in logs; the issue body
          # below redacts it by hand.
          if [ -n "${CC_RELEASE_PAT:-}" ]; then
            push_to="https://x-access-token:${CC_RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          else
            push_to="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          report_refused_push() {
            sed 's#x-access-token:[^@]*@#x-access-token:***@#' push.err >&2
            title="auto-rebase: cannot move main-patched to $NEW"
            if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')" ]; then
              cat > issue.md <<BODY
          The series rebased cleanly from \`$BASE\` onto \`$NEW\` and passed
          \`cargo check\` and \`cargo test\`, but the push was refused, so
          \`main-patched\` was not moved and nothing was tagged or built:

          \`\`\`
          $(sed 's#x-access-token:[^@]*@#x-access-token:***@#' push.err)
          \`\`\`

          Two usual causes:

          - **\`stale info\`**: someone pushed to \`main-patched\` while the job
            ran. Nothing is lost and nothing needs doing; the next run starts
            from the new tip.
          - **a workflow-file refusal**: upstream changed files under
            \`.github/workflows/\` between \`$BASE\` and \`$NEW\`, and the token
            doing the push may not write workflow files. \`GITHUB_TOKEN\` never
            can. \`CC_RELEASE_PAT\` can once the token has the repository
            permission **Workflows: read and write** next to **Contents: read
            and write**, and has not expired. Fix the secret, then re-run
            [auto-rebase](../../actions/workflows/auto-rebase.yml).
          BODY
              url=$(gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -F body=@issue.md --jq .html_url)
              echo "$url"
              gh issue edit "$url" --add-label auto-rebase >/dev/null 2>&1 || true
            fi
            exit 1
          }

          if [ "$MODE" = "rebase" ]; then
            # The tip being replaced, kept reachable under the base it sat on.
            # auto/* branches are scratch space and are overwritten freely.
            git push --force "$push_to" "$START:refs/heads/auto/$BASE" 2> push.err || report_refused_push

            # The lease names the commit this job checked out, so a commit
            # someone pushed meanwhile makes this fail instead of disappear.
            # Spelled out in full because a URL remote has no tracking ref for
            # a bare --force-with-lease to compare against.
            git push "--force-with-lease=refs/heads/main-patched:$START" "$push_to" \
              "HEAD:refs/heads/main-patched" 2> push.err || report_refused_push
            echo "main-patched moved from $BASE to $NEW; the old tip is auto/$BASE." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # Suffix rule: n = 1 + how many cc-<version>-* tags exist, counted on
          # the remote rather than in this clone, so a retry can never reuse a
          # number that already has a build attached to it.
          n=$(( $(git ls-remote --tags --refs origin "refs/tags/cc-$NEW-*" | grep -c . || true) + 1 ))
          tag="cc-$NEW-$n"

          if [ -n "${CC_RELEASE_PAT:-}" ]; then
            # A tag pushed with GITHUB_TOKEN starts nothing -- GitHub suppresses
            # workflow triggers from that token to prevent loops -- so the tag
            # goes up with the fine-grained PAT instead.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Zed ${NEW#v} + Claude Code IDE"
            git push "$push_to" "refs/tags/$tag"
            echo "Tagged $tag; cc-release is building it and promotes it to /releases/latest when all three platforms are green." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          title="auto-rebase: $NEW is ready to release"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')" ]; then
            echo "issue already open" && exit 1
          fi
          cat > issue.md <<BODY
          \`main-patched\` carries this fork's patch series on upstream
          \`$NEW\`. It compiles and its tests pass.

          Nothing has been built: the \`CC_RELEASE_PAT\` secret is not set (or
          has expired), and a tag pushed with \`GITHUB_TOKEN\` starts no
          workflow. Restore the secret and the next run tags it, or tag by hand:

          \`\`\`
          git fetch fork && git checkout main-patched && git reset --hard fork/main-patched
          git tag -a $tag -m "Zed ${NEW#v} + Claude Code IDE"
          git push fork $tag
          \`\`\`

          That starts [cc-release](../../actions/workflows/cc-release.yml),
          which builds all three platforms and, when every leg's channel guard
          passes, publishes and promotes the release itself.

          (\`fork\` is the remote name on the Windows clone; it is \`origin\` on
          the others. Use whichever points at ixiion001/zed.)
          BODY
          url=$(gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -F body=@issue.md --jq .html_url)
          echo "$url"
          gh issue edit "$url" --add-label auto-rebase >/dev/null 2>&1 || true
          exit 1

      # Upstream's workflows are disabled in this fork: they skip on their
      # `repository_owner == 'zed-industries'` guards or need PRs, so they did no
      # work here, yet their schedules filled the run list -- the suspected
      # trigger of GitHub's fork usage flag (support ticket #4903811). A disabled
      # workflow stays disabled across rebases, but one upstream *adds* arrives
      # active once a push registers it. Runs every week, rebase or not, and
      # after the step that moves main-patched, so a workflow that move
      # registers is caught in the same run. Non-fatal: tidiness must never fail
      # the job.
      - name: Disable upstream workflows
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state == "active")
                  | select(.path | startswith(".github/workflows/"))
                  | select(.path | test("/(auto-rebase|cc-release|claude-code-ide|heartbeat)\\.yml$") | not)
                  | "\(.id) \(.path)"' |
          while read -r workflow_id workflow_path; do
            if gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/disable" >/dev/null; then
              echo "disabled $workflow_path"
            else
              echo "::warning::could not disable $workflow_path"
            fi
          done

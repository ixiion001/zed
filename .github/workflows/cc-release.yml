# Builds this fork (Zed + the claude_code_ide patch) and publishes installable
# archives, so the Windows, macOS and Linux machines can run the patched editor
# without each building it locally.
#
# Named `cc-release` rather than `release` so it sits *beside* Zed's own
# .github/workflows/release.yml instead of replacing it. Upstream regenerates
# that file from `xtask::workflows::release`, so overwriting it made every rebase
# conflict; upstream's copy is inert here anyway, its jobs being guarded by
# `repository_owner == 'zed-industries'`.
#
# Zed's own auto-updater cannot be used here: a `stable`-channel build downloads
# the official binary and overwrites this one, silently dropping the patch. Every
# build therefore forces the `dev` channel, which disables that updater, and a
# separate updater script handles updates instead.
name: cc-release

on:
  push:
    tags: ["cc-v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: JSON array of runners to build
        # Must match the matrix fallback below, or a manual dispatch quietly
        # builds a subset of what a tag would.
        default: '["windows-latest","ubuntu-24.04","macos-latest"]'
        required: false

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  # `crates/zed/RELEASE_CHANNEL` says "stable" and the bundle scripts export it.
  # Setting it here keeps auto-update off; see the header.
  ZED_RELEASE_CHANNEL: dev
  # Cargo's vendored libgit2 cannot check out the `pet` dependency on Windows:
  # its conda fixtures exceed MAX_PATH. The git CLI honours core.longpaths.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.platforms || '["windows-latest","ubuntu-24.04","macos-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      # Must precede any cargo invocation, including the cache action's
      # `cargo metadata`.
      - name: Enable long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
          cache-on-failure: true

      # Linux does not use this step: script/bundle-linux runs its own cargo
      # build against an explicit target triple, and building twice would just
      # cost an hour.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --package zed --package cli

      # zed's build script downloads conpty and drops it beside the binary; the
      # integrated terminal will not open without these two files.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rel = "target/release"
          $version = (Get-Item "$rel/zed.exe").VersionInfo.ProductVersion
          if ($version -notmatch '\+dev\.') {
            throw "refusing to publish: expected a dev-channel build, got '$version'. " +
                  "A stable-channel binary would auto-update itself and discard the patch."
          }
          # The channel check above is the one that must never be bypassed. This
          # second one guards a different mistake -- publishing a binary built
          # from a commit other than the one being tagged. It warns rather than
          # fails when the version format is unrecognised, so an upstream change
          # to how the string is composed cannot block a release that is
          # otherwise sound; a commit that is present and *wrong* still fails.
          if ($version -match '([0-9a-f]{7,40})\s*$') {
            if (-not $env:GITHUB_SHA.StartsWith($Matches[1])) {
              throw "refusing to publish: '$version' was not built from $env:GITHUB_SHA"
            }
          } else {
            Write-Output "::warning::could not read a commit out of '$version'; skipping the commit check"
          }
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "$rel/zed.exe","$rel/cli.exe","$rel/conpty.dll","$rel/OpenConsole.exe" staging/
          $name = "zed-claude-code-windows-x86_64"
          Compress-Archive -Path staging/* -DestinationPath "$name.zip" -Force
          # Written through .NET rather than Out-File so the line ending is LF:
          # PowerShell would emit CRLF, which makes `sha256sum -c` on Linux and
          # macOS look for a filename with a trailing carriage return and fail.
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/$name.zip.sha256", "$hash  $name.zip`n")
          "built $version" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      # GitHub's macOS runners are far smaller than the persistent ones upstream
      # builds on — they only clear `target` past 350 GB — and a Zed tree is
      # ~11 GB before remote_server. The simulator runtimes are the biggest
      # thing here that building Zed cannot need. Never touch Xcode itself:
      # `xcrun metal` lives in it.
      # Everything script/bundle-mac needs that the image might not have.
      # Failing here costs five minutes; failing inside the bundle step costs
      # twenty minutes of a two-hour build.
      - name: Check the macOS toolchain
        if: runner.os == 'macOS'
        run: |
          sw_vers && uname -m
          # A Zed tree is ~11 GB; this image reported 96 GB free, so no reclaim
          # step is warranted. Printed so a later ENOSPC has a number to compare
          # against rather than a guess.
          df -h / | tail -1
          # gpui compiles the Metal shaders at build time (gpui_macos/build.rs).
          # `metal` ships with Xcode, not the Command Line Tools, and recent
          # Xcode makes it a separately downloadable component:
          # `xcodebuild -downloadComponent MetalToolchain` if this fails.
          xcrun -sdk macosx metal --version
          cmake --version | head -1
          # bundle-mac installs this itself; doing it here catches a fork that
          # no longer builds before the long step rather than during it.
          cargo install cargo-bundle \
            --git https://github.com/zed-industries/cargo-bundle.git --branch zed-deploy
          found=$(cargo -q bundle --help 2>&1 | head -n 1)
          test "$found" = "cargo-bundle v0.6.1-zed" || { echo "got: $found"; exit 1; }
          # bundle-mac reads both of these through the `dev` channel name.
          test -f crates/zed/contents/dev/embedded.provisionprofile
          grep -q '^\[package.metadata.bundle-dev\]' crates/zed/Cargo.toml

      # bundle-mac shells out to `npm install --global dmg-license` for the
      # DMG's license agreement.
      - uses: actions/setup-node@v7
        if: runner.os == 'macOS'
        with:
          node-version: '24'

      # Upstream's own release workflow runs exactly this line, so it stays
      # unmodified here: no second recipe to keep working across rebases.
      - name: Build and bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          # Same reason as the Linux leg: bundle-mac reads the channel from this
          # file and re-exports it *over* the environment, so the env var above
          # governs nothing here. It also picks the provisioning profile and the
          # bundle name from it — left at "stable" this ships an auto-updating
          # binary that would replace itself with official Zed.
          echo dev > crates/zed/RELEASE_CHANNEL

          # Stamp the commit into the bundle so the updater can tell which build
          # is installed. macOS is the one platform whose artifact cannot say by
          # itself: `cli --version` there reports CFBundleShortVersionString,
          # which carries neither channel nor commit.
          #
          # Editing the finished Info.plist would break the ad-hoc signature, so
          # this goes in before anything is built: `[package.metadata.bundle-dev]`
          # sets `osx_info_plist_exts = ["resources/info/*"]`, cargo-bundle merges
          # every fragment there into Info.plist, and bundle-mac signs afterwards.
          # Written per build and never committed.
          printf '<key>ZedCommitSha</key>\n<string>%s</string>\n' "$GITHUB_SHA" \
            > crates/zed/resources/info/CommitSha.plist

          ./script/bundle-mac aarch64-apple-darwin

          rel="target/aarch64-apple-darwin/release"
          # bundle-mac moves the bundle into the DMG staging directory before
          # creating the image, so that is where it is left.
          app=$(ls -d "$rel"/dmg/*.app)
          plist="$app/Contents/Info.plist"
          id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$plist")
          # The macOS counterpart of the Windows `+dev.` check and the Linux
          # zed-dev.app check. Only a dev-channel build carries this identifier,
          # and reading it needs no binary execution.
          if [ "$id" != "dev.zed.Zed-Dev" ]; then
            echo "refusing to publish: expected a dev-channel bundle, got '$id'" >&2
            exit 1
          fi

          # Whether cargo-bundle picked the fragment up decides only how well the
          # updater behaves on a hand-installed copy — it falls back to the state
          # file it writes itself — so this reports rather than fails. Failing a
          # two-hour build over it would cost far more than it saves.
          stamped=$(/usr/libexec/PlistBuddy -c 'Print :ZedCommitSha' "$plist" 2>/dev/null || true)
          if [ "$stamped" != "$GITHUB_SHA" ]; then
            echo "::warning::Info.plist carries no ZedCommitSha (got '$stamped'); the macOS updater will fall back to its state file"
          fi

          name="zed-claude-code-macos-aarch64.dmg"
          mv "$rel/Zed-aarch64.dmg" "$name"
          shasum -a 256 "$name" > "$name.sha256"
          echo "built $name ($(du -h "$name" | cut -f1), $id)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: ./script/linux

      # script/bundle-linux is worth using rather than tarring the bare binary:
      # it copies the libstdc++ and other ldd dependencies in beside it, so the
      # result still starts on distros whose system libstdc++ lacks the GLIBCXX
      # symbols this toolchain needs, and it adds the icons, .desktop entry and
      # licenses.
      - name: Build and bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          # bundle-linux reads the channel from this file, not from the
          # environment, and derives the bundle and desktop-entry names from it.
          # Left at "stable" it would package a dev binary under stable names.
          # The env var above already governs what gets compiled in; this keeps
          # the packaging agreeing with it.
          echo dev > crates/zed/RELEASE_CHANNEL
          script/bundle-linux

          archive=$(ls target/release/zed-linux-*.tar.gz)
          # bundle-linux names the tarball zed-linux-<arch>.tar.gz, which is
          # byte-for-byte the filename upstream's own Linux build produces — so
          # in a Downloads folder ours would be indistinguishable from official
          # Zed, the confusion this fork has to avoid rather than create. Rename
          # it into the zed-claude-code-<os>-<arch> form the other two legs use.
          name="zed-claude-code-linux-$(uname -m).tar.gz"
          mv "$archive" "$name"

          # The bundle directory is named from the same channel the build used,
          # so finding zed-dev.app is what proves this is not a stable build —
          # and a stable build is the one thing that must never ship, its
          # auto-updater being able to replace the patched editor with official
          # Zed. Checked without executing the binary, which needs a display.
          if ! tar -tzf "$name" | grep -q '^zed-dev\.app/'; then
            echo "refusing to publish: bundle is not a dev-channel build" >&2
            tar -tzf "$name" | head -3 >&2
            exit 1
          fi

          # The check above proves what the packaging *named* things. Running the
          # binary proves what was compiled into it, and prints the commit as
          # well: `Zed dev <version> <sha>`. --version needs no display, and
          # script/linux has already installed libasound2-dev, so the one runtime
          # dependency this bundle does not carry is present.
          #
          # This is the only leg that can run what it built, which makes it the
          # strongest of the three guards: one command covering a wrong channel,
          # a wrong commit, and a binary that will not start at all.
          probe=$(mktemp -d)
          tar -xzf "$name" -C "$probe"
          reported=$("$probe/zed-dev.app/bin/zed" --version)
          rm -rf "$probe"
          echo "reported: $reported"
          case "$reported" in
            "Zed dev "*) ;;
            *) echo "refusing to publish: expected a dev-channel build, got '$reported'" >&2
               echo "A stable-channel binary would auto-update itself and discard the patch." >&2
               exit 1 ;;
          esac
          case "$reported" in
            *"$GITHUB_SHA"*) ;;
            *) echo "refusing to publish: '$reported' was not built from $GITHUB_SHA" >&2
               exit 1 ;;
          esac

          sha256sum "$name" > "$name.sha256"
          echo "built $name ($(du -h "$name" | cut -f1))" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: zed-claude-code-${{ matrix.os }}
          path: |
            *.zip
            *.zip.sha256
            *.tar.gz
            *.tar.gz.sha256
            *.dmg
            *.dmg.sha256
          if-no-files-found: error

  # One job for every platform, so a multi-platform release stays a single entry
  # rather than one per operating system.
  publish:
    name: publish prerelease
    needs: build
    if: startsWith(github.ref, 'refs/tags/cc-v')
    runs-on: ubuntu-latest
    # The repository default for GITHUB_TOKEN is read-only; creating a release
    # needs write. Naming any scope here sets every unnamed one to `none`, hence
    # the explicit `actions: read` for reading this run's artifacts.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The archives round-trip through artifact storage, so check the hash we
      # are about to publish against the bytes we are about to publish.
      - name: Verify checksums
        run: cd dist && sha256sum -c ./*.sha256

      # Always a prerelease, never conditionally. `/releases/latest` excludes
      # prereleases, so this one flag is what stops a machine updating itself to
      # a build nobody has looked at; promoting is a deliberate
      # `gh release edit <tag> --prerelease=false`.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # This job deliberately does not check the repository out, so `gh` has
          # no git remote to infer the repository from and would abort with
          # "not a git repository". GH_REPO supplies it directly.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          upstream="${TAG#cc-v}"
          upstream="${upstream%-*}"

          # Quoted heredoc: the body is full of backticks, which an unquoted one
          # would try to execute. Placeholders are filled in afterwards.
          cat > notes.md <<'NOTES'
          **Unofficial build of [Zed](https://zed.dev) with native Claude Code IDE integration.**
          Not affiliated with or endorsed by Zed Industries.

          Zed **@UPSTREAM@** plus `crates/claude_code_ide`, built from `@COMMIT@`.
          Run the unmodified `claude` CLI in Zed's integrated terminal and it connects
          on its own — diagnostics, open-file and Keep/Reject diffs appear in the editor.

          ### Install — Windows

          Unzip into `%LOCALAPPDATA%\Programs\ZedDev` and run `zed.exe` from there.
          `conpty.dll` and `OpenConsole.exe` have to sit beside it or the integrated
          terminal will not open. No installer, no admin rights, nothing added to `PATH`.

          `script/update-zed.ps1` handles later updates and adds a "Zed (Claude Code)"
          Start Menu entry, which matters if you also have a local build — both are
          otherwise just called "Zed".

          ### Install — macOS (Apple silicon)

          Open the `.dmg` and drag **Zed Dev.app** to `/Applications`. The build is
          unsigned, so Gatekeeper quarantines it — clear that once, or macOS reports
          the app as damaged:

          ```
          xattr -dr com.apple.quarantine "/Applications/Zed Dev.app"
          ```

          It installs alongside official Zed rather than replacing it. Both read the
          same settings, in `~/Library/Application Support/Zed`; only the workspace
          database is kept apart (`db/0-dev` against `db/0-stable`), so open tabs and
          window layout do not bleed between the two.

          ### Install — Linux

          ```
          sudo apt install libasound2t64      # libasound2 on releases before 24.04
          tar -xzf zed-claude-code-linux-x86_64.tar.gz -C ~/.local
          ln -sf ~/.local/zed-dev.app/bin/zed ~/.local/bin/zed
          ```

          `libstdc++` and most other shared libraries are bundled alongside the binary,
          but **ALSA is not** — upstream's packaging assumes it is present, as it is on
          any desktop with audio. Without it the editor fails to start with
          `error while loading shared libraries: libasound.so.2`, which does not say
          what to install.

          Built on Ubuntu 24.04, so **glibc 2.39 is the floor**. Verified: it resolves
          on 24.04 and fails on Ubuntu 22.04 (glibc 2.35) and Debian 12 (2.36), both
          wanting `GLIBC_2.38` and `GLIBC_2.39`.

          ### Verify the download

          Every asset ships a `.sha256` beside it:

          ```
          sha256sum -c <asset>.sha256
          ```

          These binaries are **unsigned**. The source is this repository at the commit
          above, and can be rebuilt from it.

          ### Updates

          A **dev-channel** build, so Zed's own auto-updater is off deliberately: a
          stable-channel build would download official Zed over this one and silently
          discard the patch. To update, close Zed and unzip a newer release over the
          top.

          ### Why prerelease

          Marked prerelease on purpose. `/releases/latest` skips prereleases, so nothing
          updates itself to this build until it is promoted by hand.

          ### Credits

          [Zed Industries](https://github.com/zed-industries/zed) for the editor, and
          [vitaly-andr](https://github.com/vitaly-andr/zed) for `crates/claude_code_ide`.
          GPL-3; corresponding source is this repository.
          NOTES

          sed -i "s|@UPSTREAM@|$upstream|g; s|@COMMIT@|$GITHUB_SHA|g" notes.md

          # `create` fails if the release already exists, e.g. on a re-run; fall
          # back to replacing its assets rather than failing the job.
          gh release create "$TAG" --prerelease \
            --title "Zed $upstream + Claude Code IDE (unofficial)" \
            --notes-file notes.md dist/* \
            || gh release upload "$TAG" dist/* --clobber

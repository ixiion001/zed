# Validation for the `claude_code_ide` crate on all three desktop platforms.
#
# The crate is only useful if it behaves identically everywhere, and the Windows
# fixes it carries touch path and URI handling shared with macOS and Linux, so
# every platform builds the crate and runs its unit tests.
name: claude_code_ide

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  # Cargo's vendored libgit2 cannot check out the `pet` git dependency on
  # Windows: some of its test fixtures exceed MAX_PATH. Shelling out to the git
  # CLI honours `core.longpaths` and sidesteps it.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Must precede any cargo invocation, including the cache action's
      # `cargo metadata`. See Zed's own Windows build troubleshooting.
      - name: Enable long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null

      # Zed's own CI uses this for the system libraries gpui links against.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./script/linux

      # rust-toolchain.toml pins the compiler; this just makes the version explicit.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: claude-code-ide-${{ matrix.os }}
          cache-on-failure: true

      - name: Build crate
        run: cargo build --package claude_code_ide

      - name: Run unit tests
        run: cargo test --package claude_code_ide -- --nocapture
